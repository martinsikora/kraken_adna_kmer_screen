# ---------------------------------------------------------------------------
# kraken_adna_kmer_screen — workflow configuration
# ---------------------------------------------------------------------------

# Pre-built reference matrix directory.
# Build once per KrakenUniq database with:
#   python scripts/build_reference_matrix.py \
#       --db-tsv   <krakendb>/database.kraken.tsv \
#       --seqid-map <krakendb>/seqid2taxid.map \
#       --species-taxids inputs/species.tax_ids.tsv.gz \
#       --out-prefix <output_dir>/reference
# The directory must contain:
#   reference.matrix.npz, reference.matrix.csc.npz,
#   reference.species.tsv, reference.features.tsv, reference.summary.tsv
reference_dir: /path/to/krakendb/kraken_adna_kmer_screen_db

# Taxonomy membership files for species and genus-level mapping.
# Generated alongside the KrakenUniq database; see README.md.
# These must be gzip-compressed TSV files with columns:
#   tax_rank, tax_id, tax_name, tax_ids_descendant
# Example (uncompressed format): species.tax_ids.tsv, genus.tax_ids.tsv
species_taxids: /path/to/species.tax_ids.tsv.gz
genus_taxids:   /path/to/genus.tax_ids.tsv.gz

# Sample/unit manifest (see units.tsv for format)
units_tsv: config/units.tsv

# Taxids to exclude when vectorizing samples.
# Defaults: 0=unclassified, 1=root, 2=Bacteria domain, 131567=cellular organisms
exclude_taxids: [0, 1, 2, 131567]

# ---------------------------------------------------------------------------
# NNLS abundance fitting
# ---------------------------------------------------------------------------
fit_mode:        fast    # exact | fast  (fast uses a two-pass candidate pruning)
fit_granularity: genus   # species | genus | within-genus
fit_constraint:  nnls    # nnls | simplex
max_candidates:  1024    # maximum species candidates per genus (fast mode)
max_feature_support: 0   # drop features present in > this many species (0=disabled)
min_genus_relative_abundance: 0.0  # genus RA threshold before within-genus fit

# Target genus filter (optional).
# Restrict abundance fitting to specific genera. Useful when the target taxon
# set is known (e.g. bacteria only, specific pathogen panel).
# - target_genus: inline list of genus names or taxids. Empty = fit all genera.
# - target_genus_file: path to a plain text file, one name/taxid per line,
#   # comments stripped. Empty string = disabled.
# Both are merged at runtime. See inputs/genera_*.txt in the workflow repo
# for pre-built lists (reference with absolute paths).
target_genus: []
target_genus_file: ""   # e.g. /path/to/kraken_adna_kmer_screen/inputs/genera_all.txt

# Evidence guarantee for the fast-mode candidate shortlist.
#
# In fast mode the shortlist keeps only the max_candidates genera with the
# largest absolute shared k-mer mass. That ranking is a magnitude, not a
# measure of evidence, so a small reference always loses: Human mastadenovirus
# C in one test sample carried 138 reads at 18.4% 5' damage (p=3e-5) and a
# fitted damage rate of 0.22, yet its genus ranked 1439 of 3095 and was cut --
# leaving no abundance row, and so no hit, while its damage and coverage
# statistics stayed in the outputs looking perfectly healthy.
#
# When enabled, any species in coverage.tsv passing the thresholds below, and
# the genus holding it, is added to the shortlist instead of competing for a
# place in it. Requiring reads to be spread over the genome (the same
# depth-aware evenness test used for hit selection) is what makes this
# affordable: a read-count floor alone admits nearly the whole candidate set
# in a diverse sample (+1934 genera), while adding the evenness test holds it
# to a median +225.
#
# Normalising the shortlist score instead was tested and rejected: ranking by
# fraction-of-reference-matched (L1) or cosine (L2) pushed these same viral
# genera further down, because a multi-species viral genus sums every species
# into its row while the sample matches one, and it evicted 101 of 434
# existing hits.
shortlist_guarantee:           true
shortlist_guarantee_min_reads: 70
# The evenness thresholds are shared with hit selection: hit_evenness_lambda_split,
# hit_max_dup_shallow and hit_min_cov_deep, set further down.

# If true, also drop sample features whose reference taxids do not map to any
# target genus. Sharpens species discrimination when target genera are known.
# Requires target_genus / target_genus_file to be non-empty.
restrict_to_target_genus_features: false

# ---------------------------------------------------------------------------
# aDNA damage profiling
# ---------------------------------------------------------------------------
# Damage is estimated only from reads inside this length window.
#
# The upper bound must sit BELOW the shortest sequencing read length used for
# the sample. A read at the read-length cap is a truncated molecule: its 3' end
# is a sequencing cut-off, not a molecule terminus, so it carries no terminal
# damage and dilutes the 3' estimate. Measured on a 100 bp run, the 3' terminal
# excess collapses from ~+4.4 points (reads under 95 bp) to +0.3 at 98-99 bp --
# contamination begins a couple of bases below the cap, not at it. Pooling lanes
# of different read length otherwise mixes different cap positions into one
# profile.
#
# The lower bound sets how far into the read the profile has a constant sample
# size: with k-mer size k, a read reaches position j only if length >= k + j.
# Below that the far positions are computed from progressively fewer, longer
# reads, which biases the plateau upward.
damage_min_read_length:      30
damage_max_read_length:      75

damage_max_pos:              10    # positions from read end to profile
damage_min_reads:            100   # minimum reads to compute damage stats for a taxon
damage_adaptive_plateau:     true  # auto-detect plateau window per taxon
damage_plateau_search_start: 3     # search window start (positions from end)
damage_plateau_search_end:   9     # search window end (< damage_max_pos)
damage_min_plateau_window:   3     # minimum plateau width
damage_plateau_noise_factor: 2.0   # allowed noise multiple above plateau mean

# Read-length strata for the damage profile (lo-hi bp). screen_unit keeps one
# set of position arrays per stratum in addition to the pooled ones, so the
# damage plot can show whether a profile holds up across read lengths. A read
# reaches k-mer position j only if its length is at least k + j, so a pooled
# profile changes its read composition along the x axis; the strata make that
# visible. Must lie inside the damage length window.
damage_strata: ["30-55", "56-75"]

# ---------------------------------------------------------------------------
# Model-based damage estimation (emitted alongside damage_score, never instead)
# ---------------------------------------------------------------------------
# Fits per-base damage rates by deconvolving the k-mer window across the
# read-length strata, writing <sample>.damage_model.tsv. Unlike damage_score
# this needs no plateau (the interior rate is a fitted parameter) and no
# read-length weighting (the parameters describe the molecules, not which
# lengths were sequenced), and its output is directly comparable to mapDamage.
#
# The fit reconstructs the read-length composition inside each stratum from the
# per-position counts, but reads with n_kmers >= damage_max_pos are censored
# into the last position and have to be represented by a single length. Keeping
# damage_max_pos at or above (damage_max_read_length - k + 1) removes that
# approximation entirely; k is typically 29, so 47 covers a 75 bp window. This
# costs memory in screen_unit and nothing in runtime.
damage_fit_model:                true
# Strata below this do not enter the fit. Note the threshold is per stratum,
# not per taxon: a taxon with 90 reads split 64/26 across two strata has no
# qualifying stratum and gets no fit at all, so lowering this cannot rescue
# every low-read taxon. Matching it to damage_min_reads keeps the model
# available for as many taxa as the damage profile itself covers -- on the
# 17-sample dev screen, moving 100 -> 70 added 10425 fits (67082 -> 77507) and
# cut the share of summary rows with no fitted rate from 26% to 15%.
damage_model_min_stratum_reads:  70

# Damage-plot hit selection: all listed hit_criteria_flag tokens must be present.
# (evenness intentionally excluded from plotting hit selection)
damage_plot_required_hit_flags:
  - damage_rate
  - within_genus_relative_abundance
  - classified_rate

# Maximum number of taxa/pages in each damage plot PDF
damage_plot_max_keys: 200

# Point colour in damage_summary.pdf:
#   evenness - evenness_index (0-1), separates genome-wide coverage from
#              reads piled on a conserved region; independent of the damage
#              signal already shown by the axes and marker shape
#   pvalue   - -log10(damage p-value), the previous behaviour
damage_plot_color_by: evenness   # evenness | pvalue

# ---------------------------------------------------------------------------
# Coverage evenness
# ---------------------------------------------------------------------------
evenness_min_reads: 50             # minimum reads to compute evenness
evenness_ranks: [species, genus]   # taxonomic ranks to report

# ---------------------------------------------------------------------------
# Summary / hit table thresholds
# ---------------------------------------------------------------------------
# The damage_rate hit criterion combines two tests: damage must be significant
# AND its fitted per-base rate must be one damage could produce. Deamination in
# a single-stranded overhang saturates near 0.5 per base, so a higher fitted
# rate means the reads mismatch the reference throughout and the terminal excess
# is a misassignment artefact. Taxa with no model fit are judged on the p-value
# alone rather than rejected.
hit_max_damage_pvalue:   0.05   # damage_pvalue < threshold
hit_max_damage_rate:     0.4    # damage_rate_5prime <= threshold
hit_min_within_genus_ra: 0.1    # within_genus_relative_abundance >= threshold
hit_min_classified_rate: 0.5    # plateau_classified_rate >= threshold

# Coverage-evenness criterion.
#
# evenness_index is E = cov / (1 - exp(-dup*cov)). It collapses to 1/dup when
# mean genome depth (lambda = dup*cov) is far below 1, and to cov when lambda is
# far above 1, so one threshold on E tests two unrelated things depending on a
# taxon's depth. depth-aware applies the appropriate test per regime:
#
#   lambda <  hit_evenness_lambda_split : dup < hit_max_dup_shallow
#   lambda >= hit_evenness_lambda_split : cov > hit_min_cov_deep
#
# Set hit_evenness_mode: legacy to restore the previous single-threshold
# behaviour (evenness_index > hit_min_evenness).
# The dup/cov thresholds below are deliberately permissive: this is an
# initial screen for candidate ancient organisms, so the cost of carrying
# extra low-evidence rows into triage is lower than that of discarding a
# real one. Tighten them for a confirmatory pass.
hit_evenness_mode:         depth-aware   # depth-aware | legacy
hit_evenness_lambda_split: 0.1           # dup*cov boundary between regimes
hit_max_dup_shallow:       6.0           # shallow regime: max k-mer duplication
hit_min_cov_deep:          0.02          # deep regime: min breadth of coverage
hit_min_evenness:          0.5           # legacy mode, and fallback when dup/cov absent

# ---------------------------------------------------------------------------
# Compute resources (mem_mb: MB RAM; runtime: minutes)
# Adjust for your cluster / scheduler.
# ---------------------------------------------------------------------------
# runtime is minutes and is a wall-clock limit under SLURM: a job that exceeds
# it is killed, so these are sized for the largest sample you expect rather than
# the typical one. Overshooting costs only scheduling priority.
#
# screen_unit is one streaming pass per lane and scales linearly with reads.
# Measured on idle cluster nodes at ~140k reads/s, and ~4x slower on a busy
# shared node, so budget from the slow figure: a 1.2e9-read lane took 2.3 h on
# an idle node and would take ~9 h on a contended one. 900 minutes covers that
# with room; the old 60 killed anything past ~2.5e8 reads.
#
# aggregate_sample now includes the per-taxon damage model fit at ~107 ms per
# taxon: 4 min for 2253 taxa, 12 min for 5219. The old 20 was marginal for
# diverse samples.
resources:
  screen_unit:       {mem_mb: 4000,  runtime: 900}
  aggregate_sample:  {mem_mb: 8000,  runtime: 120}
  fit_abundance:     {mem_mb: 16000, runtime: 90}
  coverage_evenness: {mem_mb: 2000,  runtime: 10}
  aggregate_all:     {mem_mb: 8000,  runtime: 20}
  plot_damage:       {mem_mb: 4000,  runtime: 20}

# Per-species genome lengths from build_species_genome_lengths.py, built once
# per database from its library_seq_info.tsv. Enables the evenness_depth column
# in coverage.tsv (see README); leave empty to omit that column.
species_genome_lengths: /datasets/apollo/databases/krakenuniq/hum_microbe_20250624/kraken_adna_kmer_screen_db/species.genome_lengths.tsv
