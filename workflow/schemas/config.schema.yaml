$schema: "https://json-schema.org/draft/2020-12/schema"
description: kraken_adna_kmer_screen workflow configuration
type: object

required:
  - reference_dir
  - species_taxids
  - genus_taxids
  - units_tsv
  - exclude_taxids
  - fit_mode
  - fit_granularity
  - fit_constraint
  - max_candidates
  - max_feature_support
  - damage_max_pos
  - damage_strata
  - evenness_ranks
  - hit_max_damage_pvalue
  - hit_min_evenness
  - hit_min_within_genus_ra
  - resources

properties:
  # --- paths ---
  reference_dir:
    type: string
    description: Directory with reference.matrix.npz / .species.tsv / .features.tsv
  species_taxids:
    type: string
  genus_taxids:
    type: string
  units_tsv:
    type: string
  target_genus_file:
    type: string
  species_genome_lengths:
    type: string

  # --- vectorization ---
  exclude_taxids:
    type: array
    items:
      type: integer
      minimum: 0
  kmer_size:
    type: integer
    minimum: 0
    default: 0
    description: Database k-mer size; 0 = infer from the classify file

  # --- NNLS fitting ---
  fit_mode:
    enum: [fast, exact]
  fit_granularity:
    enum: [species, genus, within-genus]
  fit_constraint:
    enum: [nnls, simplex]
  max_candidates:
    type: integer
    minimum: 1
  max_feature_support:
    type: integer
    minimum: 0
  min_genus_relative_abundance:
    type: number
    minimum: 0
    default: 0.0
  target_genus:
    type: array
  restrict_to_target_genus_features:
    type: boolean
    default: false
  shortlist_guarantee:
    type: boolean
    default: true
  shortlist_guarantee_min_reads:
    type: integer
    minimum: 0
    default: 70

  # --- damage ---
  damage_min_read_length:
    type: integer
    minimum: 1
    default: 30
  damage_max_read_length:
    type: integer
    minimum: 1
    default: 75
  damage_max_pos:
    type: integer
    minimum: 2
  damage_min_reads:
    type: integer
    minimum: 1
    default: 100
  damage_adaptive_plateau:
    type: boolean
    default: true
  damage_plateau_search_start:
    type: integer
    minimum: 1
    default: 3
  damage_plateau_search_end:
    type: integer
    minimum: 1
    default: 9
  damage_min_plateau_window:
    type: integer
    minimum: 1
    default: 3
  damage_plateau_noise_factor:
    type: number
    exclusiveMinimum: 0
    default: 2.0
  damage_strata:
    type: array
    items:
      type: string
      pattern: "^[0-9]+-[0-9]+$"
  damage_fit_model:
    type: boolean
    default: true
  damage_model_min_stratum_reads:
    type: integer
    minimum: 1
    default: 70

  # --- plotting ---
  damage_plot_required_hit_flags:
    type: array
    items:
      enum: [damage_rate, evenness_index, within_genus_relative_abundance, classified_rate]
  damage_plot_max_keys:
    type: integer
    minimum: 1
    default: 200
  damage_plot_color_by:
    type: string

  # --- evenness ---
  evenness_min_reads:
    type: integer
    minimum: 0
    default: 50
  evenness_ranks:
    type: array
    items:
      type: string

  # --- hit criteria ---
  hit_max_damage_pvalue:
    type: number
    exclusiveMinimum: 0
    maximum: 1
  hit_max_damage_rate:
    type: number
    minimum: 0
    maximum: 1
    default: 0.4
  hit_evenness_mode:
    enum: [depth-aware, legacy]
    default: depth-aware
  hit_evenness_lambda_split:
    type: number
    exclusiveMinimum: 0
    default: 0.1
  hit_max_dup_shallow:
    type: number
    exclusiveMinimum: 0
    default: 6.0
  hit_min_cov_deep:
    type: number
    exclusiveMinimum: 0
    default: 0.02
  hit_min_evenness:
    type: number
    minimum: 0
  hit_min_within_genus_ra:
    type: number
    minimum: 0
    maximum: 1
  hit_min_classified_rate:
    type: number
    minimum: 0
    maximum: 1
    default: 0.5

  # --- resources ---
  resources:
    type: object
    required:
      - screen_unit
      - aggregate_sample
      - fit_abundance
      - coverage_evenness
      - aggregate_all
    additionalProperties:
      type: object
      required: [mem_mb, runtime]
      properties:
        mem_mb:
          type: integer
          minimum: 1
        runtime:
          type: integer
          minimum: 1
